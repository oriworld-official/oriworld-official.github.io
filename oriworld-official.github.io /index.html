<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORI WORLD — Official Page</title>
    <link rel="icon" type="image/png" href="logo.png">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0b131e 0%, #162638 50%, #241b15 100%);
            color: #f3e9d2;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            text-align: center;
            overflow-x: hidden;
        }
        body::before {
            content: '';
            position: fixed;
            top: -150px;
            left: 50%;
            transform: translateX(-50%);
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(245, 176, 65, 0.15) 0%, rgba(0, 0, 0, 0) 70%);
            z-index: -1;
            pointer-events: none;
        }
        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }
        .card {
            background: rgba(20, 28, 38, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(223, 211, 190, 0.25);
            border-radius: 24px;
            padding: 45px 35px;
            max-width: 520px;
            width: 100%;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
            animation: fadeIn 0.8s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .logo {
            width: 230px;
            height: 230px;
            object-fit: cover;
            border-radius: 20px;
            border: 3px solid #dfd3be;
            box-shadow: 0 12px 30px rgba(245, 176, 65, 0.25);
            margin-bottom: 25px;
            transition: transform 0.3s ease;
        }
        .logo:hover {
            transform: scale(1.04);
        }
        h1 {
            font-size: 2.8rem;
            letter-spacing: 6px;
            margin-bottom: 12px;
            background: linear-gradient(90deg, #dfd3be, #f5b041, #dfd3be);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .divider {
            width: 80px;
            height: 3px;
            background: #f5b041;
            margin: 0 auto 20px;
            border-radius: 2px;
        }
        p {
            font-size: 1.1rem;
            color: #c8b89d;
            line-height: 1.6;
            margin-bottom: 35px;
        }
        .btn {
            background: linear-gradient(135deg, #dfd3be 0%, #c5b396 100%);
            color: #1a1510;
            text-decoration: none;
            padding: 15px 36px;
            border-radius: 10px;
            font-weight: 800;
            font-size: 1rem;
            letter-spacing: 1.5px;
            display: inline-block;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
            transition: all 0.25s ease;
        }
        .btn:hover {
            background: linear-gradient(135deg, #f5b041 0%, #e67e22 100%);
            color: #fff;
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(245, 176, 65, 0.35);
        }
        footer {
            padding: 20px;
            font-size: 0.85rem;
            color: #6c7a89;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <main>
        <div class="card">
            <img src="logo.png" alt="Ori World" class="logo">
            <h1>ORI WORLD</h1>
            <div class="divider"></div>
            <p>Independent creative team.<br>New adventures are on the horizon — stay tuned.</p>
            
            <a href="https://gamejolt.com/@ori_world" class="btn">FOLLOW ON GAME JOLT</a>
        </div>
    </main>

    <footer>
        &copy; 2026 ORI WORLD. ALL RIGHTS RESERVED.
    </footer>

</body>
</html>
