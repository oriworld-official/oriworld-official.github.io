<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORI WORLD — Official Page</title>
    <link rel="icon" type="image/png" href="logo.png">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0b131e 0%, #162638 50%, #241b15 100%);
            color: #f3e9d2;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            text-align: center;
        }
        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }
        .card {
            background: rgba(20, 28, 38, 0.85);
            border: 1px solid rgba(223, 211, 190, 0.3);
            border-radius: 24px;
            padding: 45px 35px;
            max-width: 520px;
            width: 100%;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
        }
        .logo {
            width: 220px;
            height: 220px;
            object-fit: cover;
            border-radius: 20px;
            border: 3px solid #dfd3be;
            margin-bottom: 25px;
        }
        h1 {
            font-size: 2.8rem;
            letter-spacing: 6px;
            margin-bottom: 12px;
            color: #f5b041;
        }
        p {
            font-size: 1.1rem;
            color: #c8b89d;
            line-height: 1.6;
            margin-bottom: 35px;
        }
        .btn {
            background-color: #dfd3be;
            color: #1a1510;
            text-decoration: none;
            padding: 15px 36px;
            border-radius: 10px;
            font-weight: 800;
            letter-spacing: 1.5px;
            display: inline-block;
        }
        .btn:hover { background-color: #f5b041; color: #fff; }
        footer { padding: 20px; font-size: 0.85rem; color: #6c7a89; }
    </style>
</head>
<body>
    <main>
        <div class="card">
            <img src="logo.png" alt="Ori World" class="logo">
            <h1>ORI WORLD</h1>
            <p>Independent creative team.<br>New adventures are on the horizon — stay tuned.</p>
            <a href="https://gamejolt.com" class="btn">FOLLOW ON GAME JOLT</a>
        </div>
    </main>
    <footer>&copy; 2026 ORI WORLD. ALL RIGHTS RESERVED.</footer>
</body>
</html>
